[project]
name = "clite"
version = "0.0.0"
description = "Interpretador da linguagem CLite, escrito em Python, com extensão orientada a objetos"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Bruno Felix" }]
keywords = ["clite", "interpreter", "compiler", "parser", "lexer", "teaching", "plp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Interpreters",
]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.120",
  "mypy>=1.14",
  "ruff>=0.9",
  "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clite"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "conformance: executa programas .clite de ponta a ponta",
  "slow: testes mais demorados, fora do ciclo rápido",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/clite"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "W",   # warnings
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
  "RET", # return
  "ARG", # unused arguments
  "PTH", # pathlib
  "RUF", # ruff-specific
]
ignore = [
  "E501", # quebra de linha é responsabilidade do formatador
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
